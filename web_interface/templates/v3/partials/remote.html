<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Outdoor Ticker — Remote</title>
    <link rel="stylesheet" href="/static/v3/app.css?v=26">
</head>
<body class="remote-body">
    <header class="remote-header" role="banner">
        <h1 class="remote-title">Outdoor Ticker</h1>
        <div id="status-pill" class="pill pill-off" role="status"
             aria-label="Display controller status: loading">
            <span class="pill-dot" aria-hidden="true"></span>
            <span id="status-text">Loading…</span>
        </div>
    </header>

    <section class="remote-section diag-section" id="diag-section" hidden>
        <h3>
            <span class="diag-header-label">Diagnostics</span>
            <span id="diag-status-dot" class="diag-status-dot" aria-hidden="true"></span>
            <button type="button" id="diag-toggle" class="diag-toggle-btn"
                    onclick="toggleDiagPanel()" aria-expanded="false"
                    aria-controls="diag-content"
                    aria-label="Show diagnostics trace details">
                Show
            </button>
        </h3>
        <div id="diag-content" hidden>
            <div id="diag-traces" class="diag-traces" aria-live="polite">
                <div class="diag-skeleton" aria-hidden="true">
                    <div class="diag-skeleton-row"></div>
                    <div class="diag-skeleton-row"></div>
                    <div class="diag-skeleton-row"></div>
                </div>
            </div>
        </div>
    </section>

    <section class="remote-section" id="mode-controls">
        <h3>Mode</h3>
        <div class="btn-grid">
            <button class="btn-big" id="btn-ticker" aria-pressed="true"  onclick="setMode('ticker')">TICKER</button>
            <button class="btn-big" id="btn-game"   aria-pressed="false" onclick="setMode('game')">GAME MODE</button>
        </div>
        <div class="toggle-row">
            <label for="auto-focus-toggle">Auto-focus live game</label>
            <button class="toggle" id="auto-focus-toggle" role="switch" aria-checked="false"
                    aria-label="Auto-focus live game toggle"
                    onclick="toggleAutoFocus()"></button>
        </div>
        <div class="toggle-row">
            <label for="auto-cycle-toggle">Auto-cycle games</label>
            <button class="toggle" id="auto-cycle-toggle" role="switch" aria-checked="true"
                    aria-label="Auto-cycle games toggle"
                    onclick="toggleAutoCycle()"></button>
        </div>
    </section>

    <section class="remote-section" id="live-games">
        <h3>Live Games</h3>
        <div id="live-games-content" class="empty">Loading…</div>
    </section>

    <section class="remote-section" id="plugin-toggles">
        <h3>Ticker Content</h3>
        <div id="plugin-toggles-content" class="empty">Loading…</div>
    </section>

    <section class="remote-section" id="kalshi-collection">
        <h3>Kalshi Feed</h3>
        <div id="kalshi-collection-content" class="empty">Loading…</div>
    </section>

    <section class="remote-section" id="nfl-draft-focus">
        <h3>NFL Draft Focus</h3>
        <button class="btn-big btn-full-width" id="btn-draft-focus" onclick="openDraftFocusModal()">OPEN DRAFT PICKER</button>
    </section>

    <div id="draft-focus-modal" class="draft-modal" role="dialog" aria-modal="true"
         aria-labelledby="draft-modal-title" aria-hidden="true">
        <div class="draft-modal-content">
            <h3 id="draft-modal-title" class="draft-modal-title">Select Draft Pick</h3>
            <div class="draft-pick-grid">
                <button class="draft-pick-btn" data-pick="1">1</button>
                <button class="draft-pick-btn" data-pick="2">2</button>
                <button class="draft-pick-btn" data-pick="3">3</button>
                <button class="draft-pick-btn" data-pick="4">4</button>
                <button class="draft-pick-btn" data-pick="5">5</button>
                <button class="draft-pick-btn" data-pick="6">6</button>
                <button class="draft-pick-btn" data-pick="7">7</button>
                <button class="draft-pick-btn" data-pick="8">8</button>
                <button class="draft-pick-btn" data-pick="9">9</button>
                <button class="draft-pick-btn" data-pick="10">10</button>
                <button class="draft-pick-btn" data-pick="11">11</button>
                <button class="draft-pick-btn" data-pick="12">12</button>
                <button class="draft-pick-btn" data-pick="13">13</button>
                <button class="draft-pick-btn" data-pick="14">14</button>
                <button class="draft-pick-btn" data-pick="15">15</button>
            </div>
            <button class="draft-modal-cancel" onclick="closeDraftFocusModal()">Cancel</button>
        </div>
    </div>

    <section class="remote-section" id="brightness-control">
        <div class="control-header">
            <label for="brightness-slider" class="control-label">Brightness</label>
            <span id="brightness-value" class="control-value-pill">—</span>
        </div>
        <input type="range" id="brightness-slider" class="remote-range"
               min="10" max="100" step="5" value="65"
               aria-labelledby="brightness-value"
               oninput="onBrightnessInput(this.value)" onchange="onBrightnessCommit(this.value)">
    </section>

    <section class="remote-section" id="stock-speed-control">
        <div class="control-header">
            <label for="stock-speed-display" class="control-label">Stock Ticker Speed</label>
            <span id="stock-speed-value" class="control-value-pill" aria-live="polite">—</span>
        </div>
        <div class="stock-speed-row">
            <button class="btn-big stock-speed-step" id="stock-speed-down"
                    onclick="onStockSpeedStep(-1)" aria-label="Decrease stock ticker speed">−</button>
            <div class="stock-speed-unit" id="stock-speed-display" aria-hidden="true">px / frame</div>
            <button class="btn-big stock-speed-step" id="stock-speed-up"
                    onclick="onStockSpeedStep(1)" aria-label="Increase stock ticker speed">+</button>
        </div>
    </section>

    {% if power_controls_enabled %}
    <section class="remote-section" id="power-controls">
        <h3>Power</h3>
        <div class="btn-grid">
            <button class="btn-big btn-danger" id="btn-reboot"   onclick="requestPowerAction('reboot')">REBOOT</button>
            <button class="btn-big btn-danger" id="btn-shutdown" onclick="requestPowerAction('shutdown')">SHUTDOWN</button>
        </div>
    </section>
    {% endif %}

    <div id="power-overlay" class="power-overlay" aria-hidden="true">
        <div class="power-spinner"></div>
        <h2 id="power-overlay-title">Shutting down…</h2>
        <p id="power-overlay-msg">Safe to unplug in ~30 seconds.</p>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <div id="pending-bar" class="pending-bar" aria-live="polite">
        <div class="pending-count"><span id="pending-count">0</span> changes pending</div>
        <button type="button" class="pending-discard" onclick="discardPending()">Discard</button>
        <button type="button" class="pending-apply" onclick="applyPending()">Apply</button>
    </div>

    <script src="/static/v3/remote.js?v=27" defer></script>
</body>
</html>
