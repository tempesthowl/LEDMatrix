<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Outdoor Ticker — Remote</title>
    <link rel="stylesheet" href="/static/v3/app.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
               background: #f9fafb; margin: 0; padding: 16px; max-width: 560px;
               margin-left: auto; margin-right: auto; }
        .remote-section { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px;
                          box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .remote-section h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase;
                             letter-spacing: .04em; color: #6b7280; font-weight: 600; }
        .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
                border-radius: 999px; font-size: 13px; font-weight: 600; }
        .pill-live { background: #d1fae5; color: #065f46; }
        .pill-off  { background: #fee2e2; color: #991b1b; }
        .pill-dot  { width: 8px; height: 8px; border-radius: 50%; }
        .pill-live .pill-dot { background: #10b981; }
        .pill-off  .pill-dot { background: #ef4444; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-big  { display: flex; flex-direction: column; align-items: center; justify-content: center;
                    min-height: 72px; border-radius: 12px; border: 2px solid #e5e7eb;
                    background: #fff; color: #111827; font-size: 15px; font-weight: 600;
                    cursor: pointer; transition: all .15s; }
        .btn-big[aria-pressed="true"] { background: #2563eb; color: #fff; border-color: #2563eb; }
        .btn-big:disabled { opacity: .4; cursor: not-allowed; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between;
                      padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
        .toggle-row:last-child { border-bottom: none; }
        .toggle-row label { font-size: 15px; font-weight: 500; }
        .toggle { position: relative; width: 48px; height: 28px; background: #d1d5db;
                  border-radius: 999px; cursor: pointer; transition: background .15s; border: none; }
        .toggle[aria-checked="true"] { background: #10b981; }
        .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
                         background: #fff; border-radius: 50%; transition: left .15s; }
        .toggle[aria-checked="true"]::after { left: 23px; }
        .game-card { display: flex; align-items: center; justify-content: space-between;
                     padding: 12px; background: #f9fafb; border-radius: 8px; margin-bottom: 8px; }
        .game-card[data-focused="true"] { background: #dbeafe; border: 1px solid #2563eb; }
        .focus-btn { min-height: 44px; min-width: 72px; padding: 8px 16px;
                     background: #2563eb; color: #fff; border: none; border-radius: 8px;
                     font-weight: 600; cursor: pointer; }
        .focus-btn:disabled { background: #9ca3af; cursor: not-allowed; }
        input[type="range"] { width: 100%; height: 32px; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
                 background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px;
                 font-size: 14px; z-index: 100; opacity: 0; transition: opacity .2s; }
        .toast.show { opacity: 1; }
        .empty { color: #9ca3af; font-size: 14px; font-style: italic; }
        .toggle.pending { box-shadow: 0 0 0 2px #f59e0b; }
        .toggle-row.pending label::after {
            content: ' •'; color: #f59e0b; font-weight: 700;
        }
        .pending-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #111827; color: #fff; padding: 12px 16px;
            display: none; align-items: center; justify-content: space-between;
            gap: 12px; box-shadow: 0 -2px 8px rgba(0,0,0,.2); z-index: 50;
        }
        .pending-bar.show { display: flex; }
        .pending-count { font-size: 14px; font-weight: 600; }
        .pending-discard, .pending-apply {
            min-height: 40px; padding: 8px 14px; border-radius: 8px;
            border: none; font-weight: 600; cursor: pointer; font-size: 14px;
        }
        .pending-discard { background: transparent; color: #e5e7eb; border: 1px solid #4b5563; }
        .pending-apply { background: #10b981; color: #fff; }
        .pending-apply:disabled { opacity: .6; cursor: wait; }
        body.has-pending { padding-bottom: 80px; }
        .select-toolbar { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 8px; }
        .select-link { font-size: 13px; color: #2563eb; cursor: pointer; background: none;
                       border: none; padding: 0; font-weight: 500; text-decoration: underline; }
        .game-check { width: 20px; height: 20px; accent-color: #2563eb; cursor: pointer;
                      flex-shrink: 0; margin-right: 10px; }
        .game-card-inner { display: flex; align-items: center; flex: 1; min-width: 0; }
    </style>
</head>
<body>
    <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h1 style="font-size:20px;margin:0;font-weight:700;">Outdoor Ticker</h1>
        <div id="status-pill" class="pill pill-off"><span class="pill-dot"></span><span id="status-text">Loading…</span></div>
    </header>

    <section class="remote-section" id="mode-controls">
        <h3>Mode</h3>
        <div class="btn-grid">
            <button class="btn-big" id="btn-ticker" aria-pressed="true"  onclick="setMode('ticker')">TICKER</button>
            <button class="btn-big" id="btn-game"   aria-pressed="false" onclick="setMode('game')">GAME MODE</button>
        </div>
        <div class="toggle-row" style="margin-top:12px;">
            <label for="auto-focus-toggle">Auto-focus live game</label>
            <button class="toggle" id="auto-focus-toggle" role="switch" aria-checked="false"
                    onclick="toggleAutoFocus()"></button>
        </div>
        <div class="toggle-row" style="margin-top:4px;">
            <label for="auto-cycle-toggle">Auto-cycle games</label>
            <button class="toggle" id="auto-cycle-toggle" role="switch" aria-checked="true"
                    onclick="toggleAutoCycle()"></button>
        </div>
    </section>

    <section class="remote-section" id="live-games">
        <h3>Live Games</h3>
        <div id="live-games-content" class="empty">Loading…</div>
    </section>

    <section class="remote-section" id="plugin-toggles">
        <h3>Ticker Content</h3>
        <div id="plugin-toggles-content" class="empty">Loading…</div>
    </section>

    <section class="remote-section" id="brightness-control">
        <h3>Brightness <span id="brightness-value" style="font-weight:normal;color:#6b7280;">—</span></h3>
        <input type="range" id="brightness-slider" min="10" max="100" step="5" value="65"
               oninput="onBrightnessInput(this.value)" onchange="onBrightnessCommit(this.value)">
    </section>

    <div id="toast" class="toast" aria-live="polite"></div>

    <div id="pending-bar" class="pending-bar" aria-hidden="true">
        <div class="pending-count"><span id="pending-count">0</span> changes pending</div>
        <button type="button" class="pending-discard" onclick="discardPending()">Discard</button>
        <button type="button" class="pending-apply" onclick="applyPending()">Apply &amp; Restart</button>
    </div>

    <script src="/static/v3/remote.js?v=11" defer></script>
</body>
</html>
